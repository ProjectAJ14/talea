# Publishing runs off a GitHub release, not off a tag push.
#
# A tag is a pointer somebody can move; a release is a deliberate, dated act
# with notes attached, and it is the thing a human (or the `release-manager`
# agent) produces at the end of the release process. Cutting the release is
# what publishes — there is no second command to remember.
#
# There is no NPM_TOKEN here. npm trusted publishing hands this workflow a
# short-lived credential over OIDC, checked against the package's configured
# publisher (this repository, this workflow file). A leaked long-lived token
# cannot exist if it was never minted, and nothing expires in a drawer.
#
# WARNING: the publisher on npmjs.com is matched by workflow FILENAME. Renaming
# this file breaks publishing until the setting is updated to match.
name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token trusted publishing and provenance are both minted from.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # any Node 22. Pinned to the 11 major on purpose: npm@latest is 12.x and
      # wants Node 22.9+, which this runner may not have on a given week.
      - run: npm install -g npm@11

      # A release can be cut from a commit whose matrix run went red. Cheap
      # here, and the alternative is finding out from the registry.
      - run: npm test

      # The tag and package.json must agree, or v0.2.0 publishes 0.2.1 and the
      # registry and the git history disagree forever.
      - name: tag matches package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          test "$tag" = "$pkg"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - run: npm publish --provenance --access public
