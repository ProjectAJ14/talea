name: ci

# Tests only. Publishing lives in publish.yml and runs off a GitHub release —
# a green run here is not a release, and a tag on its own no longer ships
# anything.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Three operating systems because the tool spends its life comparing paths,
    # and a path bug only ever shows up on the platform you did not run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci`: this package has no dependencies, runtime or dev, so there
      # is nothing to install and no lockfile to install it from.
      - run: npm test
      # Every step must work in cmd.exe as well as bash, which is why this is a
      # node one-liner and not `./bin/talea.js --version`.
      - run: node bin/talea.js --version
      - run: node bin/talea.js --help
      - run: node bin/talea.js doctor
        continue-on-error: true

