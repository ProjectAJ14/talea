name: ci

# Tests only. Publishing lives in publish.yml and runs off a GitHub release —
# a green run here is not a release, and a tag on its own no longer ships
# anything.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Three operating systems because the tool spends its life comparing paths,
    # and a path bug only ever shows up on the platform you did not run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci`: this package has no dependencies, runtime or dev, so there
      # is nothing to install and no lockfile to install it from.
      - run: npm test
      # Every step must work in cmd.exe as well as bash, which is why this is a
      # node one-liner and not `./bin/talea.js --version`.
      - run: node bin/talea.js --version
      - run: node bin/talea.js --help
      - run: node bin/talea.js doctor
        continue-on-error: true

  coverage:
    # 100% of lines, branches and functions, or the run fails. One job, not the
    # whole matrix: the thresholds need Node >= 22.8 (Node 20 has coverage but
    # no flag to fail on it), and the numbers are measured on Linux — a branch
    # that only runs on Windows is exercised by a test that fakes the platform,
    # never by waiting for a runner that has it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run coverage
      - if: failure()
        run: |
          node --test --experimental-test-coverage --test-coverage-include='src/**' --test-reporter=lcov --test-reporter-destination=lcov.info >/dev/null 2>&1 || true
          awk '/^SF:/{f=$0} /^BRDA:/{split($0,a,","); if (a[4]=="0"||a[4]=="-") print f, $0}' lcov.info

