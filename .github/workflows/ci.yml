name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Three operating systems because the tool spends its life comparing paths,
    # and a path bug only ever shows up on the platform you did not run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci`: this package has no dependencies, runtime or dev, so there
      # is nothing to install and no lockfile to install it from.
      - run: npm test
      # Every step must work in cmd.exe as well as bash, which is why this is a
      # node one-liner and not `./bin/talea.js --version`.
      - run: node bin/talea.js --version
      - run: node bin/talea.js --help
      - run: node bin/talea.js doctor
        continue-on-error: true

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step cuts the GitHub release.
      contents: write
      # Required for npm provenance — the attestation that links the published
      # tarball back to this workflow run and this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The tag and package.json must agree, or v0.2.0 publishes 0.1.0 and the
      # registry and the git history disagree forever. Cheap to check, painful
      # to discover later.
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          test "$tag" = "$pkg"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: github release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
